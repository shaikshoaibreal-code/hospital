header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;color:#0b3a66;border-bottom:1px solid #cfe3f5}
header b{font-size:20px}header b span{color:#1565c0}
#burger{display:none;background:none;border:0;font-size:24px;color:#0b3a66}
.wrap{display:flex;min-height:calc(100vh - 56px)}
nav{width:230px;padding:18px 0;background:#fff;color:#0b3a66;border-right:1px solid #cfe3f5;text-align:center;flex-shrink:0}
.av{width:84px;height:84px;border-radius:50%;border:3px solid #1565c0;margin:0 auto 6px;display:grid;place-items:center;font-size:34px;background:var(--bg)}
nav h3{margin:0 0 14px;letter-spacing:.06em;color:#0b3a66}
nav button{display:block;width:100%;text-align:left;padding:14px 22px;border:0;border-top:1px solid #e1edf8;background:transparent;color:#0b3a66;font:inherit;cursor:pointer}
nav button:hover,nav button.on{background:#1565c0;color:#fff}
main{flex:1;padding:24px;min-width:0}
h2{margin:0 0 16px;font-size:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stats .card{margin:0}.stats strong{display:block;font-size:28px;color:var(--acc)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,select{padding:9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#0b3a66;font:inherit}
.btn{padding:9px 16px;border:0;border-radius:6px;background:var(--btn);color:var(--btnt);font:inherit;cursor:pointer}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}
.tag{padding:2px 9px;border-radius:12px;font-size:12px;background:#f6c9c9;color:#7a1f1f}.tag.p{background:#bfecd0;color:#14502b}
.empty{color:var(--mute);padding:12px 0}
dialog{border:0;border-radius:6px;padding:0;max-width:96vw;background:transparent}
dialog::backdrop{background:rgba(0,0,0,.5)}
.rc{background:var(--pad);color:#000;width:560px;max-width:96vw;padding:22px;font-family:Arial,sans-serif}
.rc h1{margin:0;text-align:center;font-size:34px}.rc p{margin:2px 0;text-align:center;font-size:13px}
.rc h4{text-align:center;margin:14px 0}
.rc table{min-width:0;border-collapse:collapse;margin:6px 0;width:100%}
.rc td{border:1px solid #000;padding:5px 8px;text-align:center;font-size:14px}.rc td.b{font-weight:bold}
.rc .amt td{font-size:26px;font-weight:bold;padding:12px}
.ra{display:flex;gap:8px;justify-content:center;padding:10px;background:#1565c0}
a.btn{text-decoration:none;display:inline-block}.tag.w{background:#ffe2a8;color:#5c3b00}.tag.c{background:#c9defa;color:#0b3a66}
.cal{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:8px;min-width:900px}.cal .d{background:rgba(255,255,255,.14);border-radius:6px;padding:6px;font-size:13px;min-height:90px}
.rc input,.rc select{border:1px solid #999}.rc label{color:#333}
.rc th{border:1px solid #000;padding:5px 8px;font-size:14px}.stats small{display:block;opacity:.85;font-size:12px}
@media print{.rc button{display:none}}
.th{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;display:block}.big{max-width:100%;border:1px solid #ccc;margin:6px 0}
@media(max-width:720px){#burger{display:block}nav{position:fixed;left:0;top:56px;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .2s}nav.open{transform:none}}
@media print{body *{visibility:hidden}.rc,.rc *{visibility:visible}dialog{position:absolute;left:0;top:0}.ra{display:none}}
</style></head><body>
<header><button id="burger" aria-label="Menu">☰</button><b>Medi<span>Care</span></b></header>
<div class="wrap">
<nav id="nav"><div class="av">👤</div><h3>JOHN DOE</h3>
<button data-v="dash">Dashboard</button><button data-v="pat">Patients</button><button data-v="appt">Appointments</button><button data-v="lab">Laboratory</button><button data-v="rpt">Reports</button><button data-v="add">Add service</button><button data-v="view">View services</button><button data-v="acc">Billing &amp; payments</button><button id="out">Logout</button></nav>
<main id="main"></main></div>
<dialog id="dlg"><div class="rc" id="rc"></div><div class="ra"><button class="btn" id="pr">Print receipt</button><button class="btn g" id="cl">Close</button></div></dialog>
<dialog id="pdlg"><div class="rc" id="pd"></div></dialog>
<script>
const K="medicare_v1";
let S={services:[{id:1,name:"General consultation",doctor:"Dr. Imran Tahir",fee:1000},{id:2,name:"Blood test",doctor:"Dr. Sara Khan",fee:1500}],bills:[],rno:1};
try{const d=localStorage.getItem(K);if(d)S=JSON.parse(d)}catch(e){}
S.patients=S.patients||[];S.uhid=S.uhid||1;S.appts=S.appts||[];S.aid=S.aid||1;
if(!S.tests){const T=(code,name,cat,sample,price)=>({code,name,cat,sample,price});
S.tests=[T("CBC","Complete Blood Count","Hematology","Blood",350),T("HGB","Hemoglobin","Hematology","Blood",150),T("BSF","Blood Sugar Fasting","Biochemistry","Blood",100),T("HBA1C","HbA1c","Biochemistry","Blood",600),T("LFT","Liver Function Test","Biochemistry","Blood",900),T("KFT","Kidney Function Test","Biochemistry","Blood",850),T("TSH","Thyroid Stimulating Hormone","Thyroid","Blood",450),T("T3","Total T3","Thyroid","Blood",400),T("T4","Total T4","Thyroid","Blood",400),T("LIPID","Lipid Profile","Lipid","Blood",800),T("URINE","Urine Routine & Microscopy","Urine","Urine",200),T("UCS","Urine Culture & Sensitivity","Microbiology","Urine",500)];
S.pkgs=[{id:1,name:"Basic Health Checkup",codes:["CBC","BSF","LIPID","URINE"],price:1500},{id:2,name:"Thyroid Profile",codes:["TSH","T3","T4"],price:1000},{id:3,name:"Diabetic Profile",codes:["BSF","HBA1C","KFT","URINE"],price:1400}]}
S.techs=S.techs||[];S.orders=S.orders||[];S.oid=S.oid||1;S.sid=S.sid||1;S.pkgs=S.pkgs||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){console.error("MediCare data could not be saved:",e);alert("Data could not be saved in this browser. Storage may be full (often due to uploaded images). Try smaller images or remove old data, then register again.");return false}};
const $=s=>document.querySelector(s),main=$("#main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}).replace(/ /g,"-");
let view="dash";
function go(v){view=v;document.querySelectorAll("nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("#nav").classList.remove("open");render()}
function render(){
 if(view==="dash")return dash();
 if(0){const paid=[],due=[];
  main.innerHTML=`<h2>Dashboard</h2><div class="stats"><div class="card">Patients<strong>${S.patients.length}</strong></div><div class="card">Services<strong>${S.services.length}</strong></div><div class="card">Bills raised<strong>${S.bills.length}</strong></div><div class="card">Collected<strong>Rs ${paid.reduce((a,b)=>a+b.amount,0)}</strong></div><div class="card">Pending<strong>Rs ${due.reduce((a,b)=>a+b.amount,0)}</strong></div></div>`}
 if(view==="pat")pat();
 if(view==="appt")appt();
 if(view==="lab")lab();
 if(view==="rpt")reports();
 if(view==="add"){main.innerHTML=`<h2>Add service</h2><div class="card"><form id="f"><label>Service name<input name="n" required></label><label>Doctor's name<input name="d" required></label><label>Fee (Rs)<input name="f" type="number" min="1" required></label><button class="btn">Add service</button></form></div>`;
  $("#f").onsubmit=e=>{e.preventDefault();const f=e.target;S.services.push({id:Date.now(),name:f.n.value,doctor:f.d.value,fee:+f.f.value});save();go("view")}}
 if(view==="view"){main.innerHTML=`<h2>View services</h2><div class="card tw"><table><tr><th>Service</th><th>Doctor</th><th>Fee</th><th></th></tr>${S.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.doctor)}</td><td>Rs ${s.fee}</td><td><button class="btn s g" data-del="${s.id}">Delete</button></td></tr>`).join("")||""}</table>${S.services.length?"":'<p class="empty">No services yet. Add one to start billing.</p>'}</div>`;
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.services=S.services.filter(s=>s.id!=b.dataset.del);save();render()})}
 if(view==="acc")return bill();
 if(0){main.innerHTML=`<h2>Accounts</h2><div class="card"><form id="f"><label>Patient<select name="p">${S.patients.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.id})</option>`).join("")}</select></label><label>Service<select name="s">${S.services.map(s=>`<option value="${s.id}">${esc(s.name)} — Rs ${s.fee}</option>`).join("")}</select></label><button class="btn">Create bill</button></form></div>
  <div class="card tw"><table><tr><th>Bill</th><th>Patient</th><th>Service</th><th>Amount</th><th>Status</th><th></th></tr>${[...S.bills].reverse().map(b=>`<tr><td>${b.id}</td><td>${esc(b.patient)}</td><td>${esc(b.service)}</td><td>Rs ${b.amount}</td><td><span class="tag ${b.paid?"p":""}">${b.paid?"Paid":"Unpaid"}</span></td><td>${b.paid?`<button class="btn s g" data-r="${b.id}">View receipt</button>`:`<button class="btn s" data-pay="${b.id}">Pay in cash</button>`}</td></tr>`).join("")}</table>${S.bills.length?"":'<p class="empty">No bills yet. Create the first bill above.</p>'}</div>`;
  $("#f").onsubmit=e=>{e.preventDefault();const f=e.target,s=S.services.find(x=>x.id==f.s.value);if(!s){alert("Add a service first.");return}const pt=S.patients.find(x=>x.id===f.p.value);if(!pt){alert("Register a patient first (Patients menu).");return}
   S.bills.push({id:S.bills.length+1,patient:pt.name,uhid:pt.id,service:s.name,doctor:s.doctor,amount:s.fee,paid:false});save();render()};
  main.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const x=S.bills.find(y=>y.id==b.dataset.pay);x.paid=true;x.rno=S.rno++;x.date=new Date().toISOString();save();render();receipt(x)});

 $("#pd").innerHTML=`<h1 style="font-size:34px;text-align:center;margin:0">SS Hospital</h1><p>Contact # 98123456789</p><p>Address # House 05</p><h4>RECEIPT</h4>
 <table><tr><td class="b">Receipt No</td><td>${p.rno}</td><td class="b">Receipt Date</td><td>${fd(p.at)}</td></tr></table>
 <table><tr><td class="b">Doctor's Name</td><td>${esc(doctor)}</td></tr></table>
 <table><tr><td colspan="2">We have received Amount from</td></tr></table>
 <table><tr><td class="b">Patient's Name</td><td>${esc(b.patient)}</td></tr></table>
 <table><tr><td colspan="2">${received}</td></tr></table>
 <table class="amt" style="width:70%;margin:12px auto"><tr><td style="width:25%">Rs/=</td><td>${money(p.amt)}</td></tr></table>
 <p style="text-align:center">Invoice No: ${esc(b.no)}</p><p style="text-align:center">Balance due: ${money(balOf(b))}</p>
 <div style="text-align:center;margin-top:10px"><button class="btn" id="pp" ${BL}>Print receipt</button> <button class="btn g" id="pc2" ${BG}>Close</button></div>`;
 $("#pp").onclick=()=>window.print();$("#pc2").onclick=()=>$("#pdlg").close();$("#pdlg").showModal()}

function invoice(b){const sub=b.items.reduce((a,i)=>a+i.price,0);
 $("#pd").innerHTML=`<h1 style="font-size:28px">${hosp}</h1><p>Contact # 98123456789 · Address # House 05</p><h4>INVOICE ${b.no}</h4><table><tr><td class="b">Patient</td><td>${esc(b.patient)} (${b.pid})</td><td class="b">Date</td><td>${fd(b.date)}</td></tr></table><table><tr><th>Item</th><th>Type</th><th>Amount</th></tr>${b.items.map(i=>`<tr><td style="text-align:left">${esc(i.name)}</td><td>${esc(i.kind||"")}</td><td>${money(i.price)}</td></tr>`).join("")}<tr><td colspan="2">Subtotal</td><td>${money(sub)}</td></tr><tr><td colspan="2">Discount</td><td>− ${money(b.discount)}</td></tr><tr><th colspan="2">Net amount</th><th>${money(netOf(b))}</th></tr><tr><td colspan="2">Paid (after refunds)</td><td>${money(paidOf(b))}</td></tr><tr><th colspan="2">Balance due</th><th>${money(balOf(b))}</th></tr></table><h4>Payment history</h4>${b.payments.length||b.refunds.length?`<table><tr><th>Date</th><th>Receipt</th><th>Type</th><th>Mode</th><th>Amount</th></tr>${b.payments.map(p=>`<tr><td>${fd(p.at)}</td><td>${p.rno}</td><td>Payment</td><td>${p.mode}${p.ref?" · "+esc(p.ref):""}</td><td>${money(p.amt)}</td></tr>`).join("")}${b.refunds.map(r=>`<tr><td>${fd(r.at)}</td><td>–</td><td>Refund (${esc(r.reason)})</td><td>${r.mode}</td><td>− ${money(r.amt)}</td></tr>`).join("")}</table>`:"<p>No payments yet.</p>"}<div style="text-align:center;margin-top:10px"><button class="btn" id="pp" ${BL}>Print invoice</button> <button class="btn g" id="pc2" ${BG}>Close</button></div>`;
 $("#pp").onclick=()=>window.print();$("#pc2").onclick=()=>$("#pdlg").close();$("#pdlg").showModal()}
const rstat=o=>o.rs||"Pending";
function reports(){
 const O=S.orders,cnt=s=>O.filter(o=>rstat(o)===s).length;
 main.innerHTML=`<h2>Reports &amp; results</h2><div class="stats">${["Pending","Entered","Verified","Delivered"].map(s=>`<div class="card">${s==="Entered"?"Awaiting verification":s}<strong>${cnt(s)}</strong></div>`).join("")}</div><div class="card tw" style="margin-top:18px"><label style="max-width:240px;margin-bottom:10px">Show<select id="rf">${["All","Pending","Entered","Verified","Delivered"].map(s=>`<option${s===rfil?" selected":""}>${s}</option>`).join("")}</select></label><div id="rl"></div></div>
 <div class="card"><h3 style="margin:0 0 10px">Patient report access</h3><form id="pa"><label>Patient ID (UHID)<input name="u" required></label><label>Last 4 digits of mobile<input name="m" maxlength="4" required></label><button class="btn">Open reports</button></form><div id="pr2"></div></div>
 <div class="card"><h3 style="margin:0 0 10px">Reference ranges by test and patient (sex and age)</h3><label style="max-width:360px">Test<select id="rt">${S.tests.map(t=>`<option value="${esc(t.code)}"${t.code===rcode?" selected":""}>${esc(t.code)} — ${esc(t.name)}</option>`).join("")}</select></label><div id="rp"></div></div>`;
 $("#rf").onchange=e=>{rfil=e.target.value;rlist()};
 $("#pa").onsubmit=e=>{e.preventDefault();const f=e.target,m=f.m.value.trim(),pt=S.patients.find(p=>p.id.toLowerCase()===f.u.value.trim().toLowerCase());
  if(!pt||m.length<4||!pt.mobile.replace(/\D/g,"").endsWith(m)){$("#pr2").innerHTML='<p class="empty">Details do not match.</p>';return}
  const L=S.orders.filter(o=>o.pid===pt.id&&["Verified","Delivered"].includes(rstat(o)));
  $("#pr2").innerHTML=L.length?L.map(o=>`<p>Order #${o.id} · ${esc(o.items.map(t=>t.code).join(", "))} <button class="btn s" data-vr="${o.id}">View report</button></p>`).join(""):'<p class="empty">No verified reports yet.</p>';
  $("#pr2").querySelectorAll("[data-vr]").forEach(b=>b.onclick=()=>report(S.orders.find(o=>o.id==b.dataset.vr)))};
 $("#rt").onchange=e=>{rcode=e.target.value;rangeEd()};rlist();rangeEd()}
function rlist(){const L=[...S.orders].reverse().filter(o=>rfil==="All"||rstat(o)===rfil);
 $("#rl").innerHTML=L.length?`<table><tr><th>Order</th><th>Patient</th><th>Tests</th><th>Sample</th><th>Report</th><th></th></tr>${L.map(o=>{const s=rstat(o),can=LST.indexOf(o.status)>=2,pt=S.patients.find(p=>p.id===o.pid)||{mobile:""};return`<tr><td>#${o.id}</td><td>${esc(o.patient)}</td><td>${esc(o.items.map(t=>t.code).join(", "))}</td><td>${o.sid||"-"}</td><td><span class="tag ${s==="Delivered"?"p":s==="Verified"?"c":s==="Entered"?"w":""}">${s==="Entered"?"Awaiting verification":s}</span></td><td>${["Pending","Entered"].includes(s)?(can?`<button class="btn s" data-en="${o.id}">${s==="Entered"?"Edit results":"Enter results"}</button> `:'<span class="empty">Receive sample first</span> '):""}${s==="Entered"?`<button class="btn s" data-vf="${o.id}">Verify</button>`:""}${["Verified","Delivered"].includes(s)?`<button class="btn s g" data-rp="${o.id}">Report</button> `:""}${s==="Verified"?`<button class="btn s" data-dl="${o.id}">Mark delivered</button> <a class="btn s g" target="_blank" rel="noopener" href="https://wa.me/${phone(pt)}?text=${encodeURIComponent("Hello "+o.patient+", your laboratory report is ready. - "+hosp)}">Notify</a>`:""}${s==="Delivered"?`<span class="empty">${fd(o.dat)}</span>`:""}</td></tr>`}).join("")}</table>`:'<p class="empty">No lab orders yet.</p>';
 const g=id=>S.orders.find(o=>o.id==id),q=s=>$("#rl").querySelectorAll(s);
 q("[data-en]").forEach(b=>b.onclick=()=>enter(g(b.dataset.en)));q("[data-vf]").forEach(b=>b.onclick=()=>verify(g(b.dataset.vf)));q("[data-rp]").forEach(b=>b.onclick=()=>report(g(b.dataset.rp)));
 q("[data-dl]").forEach(b=>b.onclick=()=>{const o=g(b.dataset.dl);o.rs="Delivered";o.dat=new Date().toISOString();save();reports()})}
function enter(o){const pt=S.patients.find(p=>p.id===o.pid)||{gender:"",age:0},L=[];
 o.items.forEach(it=>{const t=S.tests.find(x=>x.code===it.code);if(t)prm(t).forEach(par=>L.push({k:it.code+"|"+par.n,par}))});
 $("#pd").innerHTML=`<h2 style="margin:0 0 6px">Enter results — order #${o.id}</h2><p>${esc(o.patient)} · ${esc(pt.age)} / ${esc(pt.gender)}</p><div class="tw"><table style="min-width:0"><tr><td class="b">Parameter</td><td class="b">Result</td><td class="b">Unit</td><td class="b">Reference</td><td class="b">Flag</td></tr>${L.map((x,i)=>{const r=rangeFor(x.par,pt);return`<tr><td>${esc(x.par.n)}</td><td><input data-i="${i}" ${x.par.text?"":'type="number" step="any"'} value="${esc((o.res||{})[x.k]??"")}" style="width:90px"></td><td>${esc(x.par.unit)}</td><td>${r?r.lo+" – "+r.hi:"–"}</td><td id="fl${i}"></td></tr>`}).join("")}</table></div><div style="text-align:center;margin-top:10px"><button class="btn" id="sv" ${BL}>Save results</button> <button class="btn g" id="pc2" ${BG}>Cancel</button></div>`;
 const upd=i=>{const f=flag(L[i].par,pt,$("#pd").querySelector(`[data-i="${i}"]`).value),c=$("#fl"+i);c.textContent=fl2(f);c.style.color=f==="Normal"?"#14502b":"#b00020";c.style.fontWeight="bold"};
 $("#pd").querySelectorAll("[data-i]").forEach(inp=>{inp.oninput=()=>upd(inp.dataset.i);upd(inp.dataset.i)});
 $("#pc2").onclick=()=>$("#pdlg").close();
 $("#sv").onclick=()=>{o.res=o.res||{};let n=0;$("#pd").querySelectorAll("[data-i]").forEach(inp=>{o.res[L[inp.dataset.i].k]=inp.value.trim();if(inp.value.trim())n++});if(!n)return;o.rs="Entered";if(o.status!=="Completed"){o.status="Completed";o.log.push({s:"Completed",at:new Date().toISOString()})}save();$("#pdlg").close();reports()};
 $("#pdlg").showModal()}
function verify(o){$("#pd").innerHTML=`<h2 style="margin:0 0 6px">Doctor verification</h2><p>Order #${o.id} · ${esc(o.patient)}</p><form id="vf" style="display:grid;gap:8px;text-align:left"><label>Verifying doctor<input name="d" list="dl" required></label><datalist id="dl">${docs().map(d=>`<option>${esc(d)}</option>`).join("")}</datalist><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="c" required>I have reviewed these results and approve the report</label><div><button class="btn" ${BL}>Approve report</button> <button class="btn g" type="button" id="pc2" ${BG}>Cancel</button></div></form>`;
 $("#pc2").onclick=()=>$("#pdlg").close();
 $("#vf").onsubmit=e=>{e.preventDefault();o.rs="Verified";o.vby=e.target.d.value.trim();o.vat=new Date().toISOString();save();$("#pdlg").close();reports()};$("#pdlg").showModal()}
function report(o){const pt=S.patients.find(p=>p.id===o.pid)||{age:"",gender:""};let rows="";
 o.items.forEach(it=>{const t=S.tests.find(x=>x.code===it.code);if(!t)return;rows+=`<tr><td colspan="5" style="background:#e8f1fb;font-weight:bold;text-align:left">${esc(it.name)}</td></tr>`;
  prm(t).forEach(par=>{const v=(o.res||{})[it.code+"|"+par.n]??"",f=flag(par,pt,v),r=rangeFor(par,pt);rows+=`<tr${f==="Low"||f==="High"?' style="font-weight:bold;color:#b00020"':""}><td style="text-align:left">${esc(par.n)}</td><td>${esc(v)||"–"}</td><td>${esc(par.unit)}</td><td>${r?r.lo+" – "+r.hi:"–"}</td><td>${fl2(f)}</td></tr>`})});
 $("#pd").style.width="720px";
 $("#pd").innerHTML=`<div style="display:flex;align-items:center;gap:12px;justify-content:center"><svg width="52" height="52" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="#1565c0"/><rect x="20" y="10" width="6" height="26" fill="#fff"/><rect x="10" y="20" width="26" height="6" fill="#fff"/></svg><div><h1 style="font-size:28px">${hosp}</h1><p>Contact # 98123456789 · Address # House 05</p></div></div><h4>LABORATORY REPORT</h4><table style="margin:0 0 8px"><tr><td class="b">Patient</td><td>${esc(o.patient)}</td><td class="b">Patient ID</td><td>${o.pid}</td></tr><tr><td class="b">Age / sex</td><td>${esc(pt.age)} / ${esc(pt.gender)}</td><td class="b">Sample ID</td><td>${o.sid||"-"}</td></tr><tr><td class="b">Order</td><td>#${o.id}</td><td class="b">Reported on</td><td>${o.vat?fd(o.vat):"-"}</td></tr></table><table><tr><td class="b">Test / parameter</td><td class="b">Result</td><td class="b">Unit</td><td class="b">Reference range</td><td class="b">Flag</td></tr>${rows}</table><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px"><div style="font-size:12px;text-align:left">Results outside the reference range are flagged.<br>Reference ranges depend on the patient's age and sex.</div><div style="text-align:center"><div style="font:italic 26px 'Brush Script MT','Segoe Script',cursive">${esc(o.vby||"")}</div><div style="border-top:1px solid #000;padding-top:2px;font-size:13px">Authorized signatory<br>${esc(o.vby||"")}</div></div></div><div style="text-align:center;margin-top:12px"><button class="btn" id="pp" ${BL}>Print / Save as PDF</button> <button class="btn g" id="pc2" ${BG}>Close</button></div>`;
 $("#pp").onclick=()=>window.print();$("#pc2").onclick=()=>$("#pdlg").close();$("#pdlg").showModal()}
function rangeEd(){const t=S.tests.find(x=>x.code===rcode)||S.tests[0];if(!t){$("#rp").innerHTML='<p class="empty">No tests yet.</p>';return}rcode=t.code;const ps=prm(t),inp=(pi,ri,f,v,w,ty)=>`<input data-pi="${pi}"${ri===undefined?"":` data-ri="${ri}"`} data-f="${f}" value="${esc(v)}" ${ty||""} style="width:${w}px">`;
 $("#rp").innerHTML=ps.map((p,pi)=>`<div class="card" style="margin:12px 0 0"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${inp(pi,undefined,"n",p.n,180)} unit ${inp(pi,undefined,"unit",p.unit,80)}<button class="btn s g" data-x="dp" data-pi="${pi}">Delete parameter</button></div>${p.text?'<p class="empty">Text result — no range.</p>':`<table style="min-width:0;margin-top:8px"><tr><th>Sex</th><th>Age from</th><th>Age to</th><th>Low</th><th>High</th><th></th></tr>${p.r.map((r,ri)=>`<tr><td><select data-pi="${pi}" data-ri="${ri}" data-f="sex">${["Any","Male","Female"].map(s=>`<option${s===r.sex?" selected":""}>${s}</option>`).join("")}</select></td><td>${inp(pi,ri,"a1",r.a1,60,'type="number"')}</td><td>${inp(pi,ri,"a2",r.a2,60,'type="number"')}</td><td>${inp(pi,ri,"lo",r.lo,70,'type="number" step="any"')}</td><td>${inp(pi,ri,"hi",r.hi,70,'type="number" step="any"')}</td><td><button class="btn s g" data-x="dr" data-pi="${pi}" data-ri="${ri}">×</button></td></tr>`).join("")}</table><button class="btn s g" data-x="ar" data-pi="${pi}" style="margin-top:8px">+ Add range</button>`}</div>`).join("")+`<button class="btn s" data-x="ap" style="margin-top:12px">+ Add parameter</button><p class="empty">Starting values are typical adult ranges. Check them against your laboratory's own reference ranges before reporting.</p>`;
 $("#rp").onchange=e=>{const el=e.target,f=el.dataset.f;if(f===undefined)return;const par=ps[+el.dataset.pi];if(el.dataset.ri===undefined)par[f]=el.value;else{const r=par.r[+el.dataset.ri];r[f]=["lo","hi","a1","a2"].includes(f)?+el.value:el.value}save()};
 $("#rp").onclick=e=>{const b=e.target.closest("[data-x]");if(!b)return;const pi=+b.dataset.pi,x=b.dataset.x;if(x==="ar")ps[pi].r.push({sex:"Any",a1:0,a2:120,lo:0,hi:0});if(x==="dr")ps[pi].r.splice(+b.dataset.ri,1);if(x==="dp")ps.splice(pi,1);if(x==="ap")ps.push({n:"New parameter",unit:"",text:0,r:[]});save();rangeEd()}}
function receipt(b){
 $("#rc").innerHTML=`<h1>SS Hospital</h1><p>Contact # 98123456789</p><p>Address # House 05</p><h4>RECEIPT</h4>
 <table><tr><td class="b">Receipt No</td><td>${b.rno}</td><td class="b">Receipt Date</td><td>${fd(b.date)}</td></tr></table>
 <table><tr><td>Doctor's Name</td><td>${esc(b.doctor)}</td></tr></table>
 <table><tr><td colspan="2">We have received Amount from</td></tr></table>
 <table><tr><td>Patient's Name</td><td>${esc(b.patient)}</td></tr></table>
 <table><tr><td>Amount Received in Cash</td></tr></table>
 <table class="amt" style="width:70%;margin:12px auto"><tr><td style="width:25%">Rs/=</td><td>${b.amount}</td></tr></table>`;
 $("#dlg").showModal()}
document.querySelectorAll("nav button[data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
$("#out").onclick=()=>go("dash");
$("#pr").onclick=()=>window.print();$("#cl").onclick=()=>$("#dlg").close();
go("dash");
</script></body></html>
